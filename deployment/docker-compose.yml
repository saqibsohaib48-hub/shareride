# Local / single-host stack: Postgres + API + web.
#   cp .env.example backend/.env   (fill secrets)
#   docker compose -f deployment/docker-compose.yml up --build
#   docker compose -f deployment/docker-compose.yml run --rm api npx tsx src/migrate.ts
#   docker compose -f deployment/docker-compose.yml run --rm api npx tsx ../database/seed/seed.ts   # DEV ONLY
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shareride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shareride}
      POSTGRES_DB: shareride
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shareride"], interval: 5s, retries: 10 }

  api:
    build: { context: .., dockerfile: deployment/Dockerfile.api }
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgres://shareride:${POSTGRES_PASSWORD:-shareride}@db:5432/shareride
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
